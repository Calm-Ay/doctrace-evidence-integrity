[project]
name = "doctrace"
version = "0.1.0"
description = "Invisible Document Watermarking & Leak-Source Identification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
    "pymupdf>=1.22.0",
    "pikepdf>=8.0.0",
    "opencv-python>=4.7.0",
    "pytesseract>=0.3.10",
    "rich>=12.0.0",
    "pillow>=9.0.0",
    "numpy>=1.22.0"
]

[project.scripts]
doctrace = "doctrace.cli:cli"

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
